<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Physics Simulation</title>
<style>
body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: Arial, sans-serif; }
canvas { display: block; cursor: crosshair; }
#info { position: absolute; top: 10px; left: 10px; color: #ccc; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px; pointer-events: none; font-size: 13px; line-height: 1.6; }
#count { position: absolute; top: 10px; right: 10px; color: #0f0; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px; pointer-events: none; font-size: 14px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="info">Left mouse: create box | Shift+click: remove box | Drag center: pan view | Ctrl+scroll: zoom</div>
<div id="count">Boxes: 0</div>
<script src="src/state.js"></script>
<script src="src/util.js"></script>
<script src="src/car.js"></script>
<script src="src/world.js"></script>
<script src="src/render.js"></script>
<script src="src/input.js"></script>
<script src="src/main.js"></script>
</body>
</html>
